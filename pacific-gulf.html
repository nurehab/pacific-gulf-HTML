<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Pacific Gulf — Flights, hotels, holidays, car hire, Hajj & Umrah, visas and investment services from Muscat.">
<meta name="theme-color" content="#0B2545">
<title>Pacific Gulf | باسيفيك جلف للسياحة والسفر</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%230B2545'/%3E%3Cpath d='M8 38c8-6 16-6 24 0s16 6 24 0' stroke='%230FA3A3' stroke-width='5' fill='none'/%3E%3Cpath d='M18 24a16 16 0 0 1 28 0' stroke='%23D4A537' stroke-width='4' fill='none'/%3E%3C/svg%3E">
<style>
/* =====================================================================
   PACIFIC GULF — Customer website prototype
   Design tokens: Navy + Teal + Gold. Light/Dark via CSS variables.
   Logical properties (inline-start/end) are used so RTL/LTR both work.
   ===================================================================== */
:root{
  --navy:#0B2545; --navy-2:#13315C; --navy-3:#1E4976;
  --teal:#0FA3A3; --teal-2:#0B8586; --teal-soft:#E0F5F4;
  --gold:#D4A537; --gold-2:#A97F17; --gold-soft:#FBF3DE;
  --bg:#F4F7FA; --surface:#FFFFFF; --surface-2:#EEF3F7; --surface-3:#E3EAF1;
  --text:#0F1B2D; --muted:#56677C; --border:#DCE4EC;
  --danger:#C0352B; --danger-soft:#FDECEA; --success:#1B8553; --success-soft:#E5F5EC;
  --warning:#A86A12; --warning-soft:#FFF4DE; --info:#2459C9; --info-soft:#E8EFFD;
  --primary:var(--teal-2); --primary-hover:#096E6F; --on-primary:#fff;
  --shadow:0 1px 2px rgba(11,37,69,.06),0 6px 18px rgba(11,37,69,.07);
  --shadow-lg:0 18px 50px rgba(11,37,69,.22);
  --radius:16px; --radius-sm:10px; --radius-xs:7px;
  --font:"Segoe UI","Noto Sans Arabic","Noto Naskh Arabic","Noto Sans",Tahoma,system-ui,-apple-system,sans-serif;
  --focus:0 0 0 3px rgba(15,163,163,.45);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#07111F; --surface:#0E1C30; --surface-2:#14263D; --surface-3:#1B3150;
    --text:#E6EDF5; --muted:#97A9BE; --border:#22384F;
    --teal-soft:#0C3434; --gold-soft:#372C10; --danger-soft:#3A1614; --success-soft:#0E3222;
    --warning-soft:#382810; --info-soft:#12284B; --primary:#12B5B5; --primary-hover:#19C9C9; --on-primary:#04201F;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35); --shadow-lg:0 18px 50px rgba(0,0,0,.6);
    --danger:#F0776D; --success:#4CC98A; --warning:#E6A84A; --info:#7FA5F5; --gold-2:#E3B954;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#07111F; --surface:#0E1C30; --surface-2:#14263D; --surface-3:#1B3150;
  --text:#E6EDF5; --muted:#97A9BE; --border:#22384F;
  --teal-soft:#0C3434; --gold-soft:#372C10; --danger-soft:#3A1614; --success-soft:#0E3222;
  --warning-soft:#382810; --info-soft:#12284B; --primary:#12B5B5; --primary-hover:#19C9C9; --on-primary:#04201F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35); --shadow-lg:0 18px 50px rgba(0,0,0,.6);
  --danger:#F0776D; --success:#4CC98A; --warning:#E6A84A; --info:#7FA5F5; --gold-2:#E3B954;
  color-scheme:dark;
}

/* ---------- Base ---------- */
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font);font-size:15.5px;line-height:1.6;color:var(--text);background:var(--bg);min-height:100vh;display:flex;flex-direction:column}
main{flex:1;outline:none}
html,body{overflow-x:clip}
img,svg{max-width:100%}
a{color:var(--primary);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4{line-height:1.25;margin:0 0 .5em;color:var(--text)}
h1{font-size:clamp(1.7rem,3.6vw,2.6rem)} h2{font-size:clamp(1.35rem,2.4vw,1.85rem)} h3{font-size:1.15rem} h4{font-size:1rem}
p{margin:0 0 1em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:none;box-shadow:var(--focus);border-radius:6px}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip-link{position:fixed;max-width:calc(100vw - 24px);inset-inline-start:12px;top:-60px;z-index:999;background:var(--gold);color:var(--navy);padding:10px 16px;border-radius:8px;font-weight:700;border:0;cursor:pointer}
.skip-link:focus{top:10px}
.container{width:100%;max-width:1220px;margin:0 auto;padding:0 16px}
.muted{color:var(--muted)} .small{font-size:.86rem} .xsmall{font-size:.78rem} .bold{font-weight:700} .center{text-align:center}
.mt-0{margin-top:0}.mt-1{margin-top:8px}.mt-2{margin-top:16px}.mt-3{margin-top:24px}.mt-4{margin-top:40px}.mb-0{margin-bottom:0}.mb-1{margin-bottom:8px}.mb-2{margin-bottom:16px}.mb-3{margin-bottom:24px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.row-between{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.stack>*+*{margin-top:12px}
.grid{display:grid;gap:20px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:960px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){.g2,.g3,.g4{grid-template-columns:1fr}}
.ic{width:1.15em;height:1.15em;vertical-align:-.2em;flex-shrink:0}
.ic-lg{width:28px;height:28px}.ic-xl{width:44px;height:44px}
[dir="rtl"] .flip-rtl{transform:scaleX(-1)}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:12px;border:1.5px solid transparent;font-weight:650;cursor:pointer;text-decoration:none!important;transition:background .15s,border-color .15s,transform .05s,box-shadow .15s;white-space:nowrap;line-height:1.2;font-size:.95rem}
.btn:active{transform:translateY(1px)}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.55;cursor:not-allowed}
.btn-primary{background:var(--primary);color:var(--on-primary)}
.btn-primary:hover:not([disabled]){background:var(--primary-hover)}
.btn-gold{background:var(--gold);color:#1d1503}
.btn-gold:hover:not([disabled]){background:#E2B547}
.btn-navy{background:var(--navy);color:#fff}
.btn-navy:hover:not([disabled]){background:var(--navy-2)}
.btn-outline{background:transparent;border-color:var(--border);color:var(--text)}
.btn-outline:hover:not([disabled]){border-color:var(--primary);color:var(--primary)}
.btn-ghost{background:transparent;color:var(--primary);padding-inline:10px}
.btn-ghost:hover{background:var(--teal-soft)}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger-outline{background:transparent;color:var(--danger);border-color:var(--danger)}
.btn-sm{padding:7px 13px;font-size:.86rem;border-radius:10px}
.btn-lg{padding:14px 26px;font-size:1.02rem}
.btn-block{width:100%}
.icon-btn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:10px;border:1px solid var(--border);background:var(--surface);cursor:pointer;color:var(--text)}
.icon-btn:hover{border-color:var(--primary);color:var(--primary)}
.spinner{width:18px;height:18px;border:2.5px solid currentColor;border-inline-end-color:transparent;border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Forms ---------- */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.field .label{font-size:.84rem;font-weight:650;color:var(--muted)}
.input,.select,.textarea{width:100%;padding:11px 13px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--surface);color:var(--text);transition:border-color .15s,box-shadow .15s;min-height:44px}
.textarea{min-height:110px;resize:vertical}
.input:focus,.select:focus,.textarea:focus{border-color:var(--teal);box-shadow:var(--focus);outline:none}
.input[aria-invalid="true"],.select[aria-invalid="true"],.textarea[aria-invalid="true"]{border-color:var(--danger)}
.err{color:var(--danger);font-size:.8rem;min-height:0}
.err:empty{display:none}
.hint{font-size:.78rem;color:var(--muted)}
.form-grid{display:grid;gap:14px;grid-template-columns:repeat(2,minmax(0,1fr))}
.form-grid .full{grid-column:1/-1}
@media (max-width:620px){.form-grid{grid-template-columns:1fr}}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-size:.92rem}
.check input{width:18px;height:18px;margin-top:3px;accent-color:var(--teal-2);flex-shrink:0}
.ltr{direction:ltr;text-align:start}
[dir="rtl"] .ltr{text-align:right}
.counter{display:flex;align-items:center;gap:10px}
.counter button{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--border);background:var(--surface);cursor:pointer;display:grid;place-items:center;color:var(--text)}
.counter button:hover:not([disabled]){border-color:var(--teal)}
.counter button[disabled]{opacity:.4;cursor:not-allowed}
.counter output{min-width:20px;text-align:center;font-weight:700}

/* ---------- Cards / badges ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-body{padding:20px}
.card-hover{transition:transform .2s,box-shadow .2s}
.card-hover:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:.76rem;font-weight:700;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.badge-teal{background:var(--teal-soft);color:var(--teal-2)}
:root[data-theme="dark"] .badge-teal{color:#5FE0DC}
.badge-gold{background:var(--gold-soft);color:var(--gold-2)}
.badge-navy{background:var(--navy);color:#fff}
.badge-success{background:var(--success-soft);color:var(--success)}
.badge-danger{background:var(--danger-soft);color:var(--danger)}
.badge-warning{background:var(--warning-soft);color:var(--warning)}
.badge-info{background:var(--info-soft);color:var(--info)}
.status-new{background:var(--info-soft);color:var(--info)}
.status-processing{background:var(--warning-soft);color:var(--warning)}
.status-completed{background:var(--success-soft);color:var(--success)}
.status-cancelled{background:var(--danger-soft);color:var(--danger)}
.stars{color:var(--gold);display:inline-flex;gap:1px}
.alert{display:flex;gap:12px;padding:14px 16px;border-radius:12px;border:1px solid var(--border);background:var(--surface-2);font-size:.92rem;align-items:flex-start}
.alert .ic{margin-top:3px}
.alert-info{background:var(--info-soft);border-color:transparent;color:var(--text)} .alert-info .ic{color:var(--info)}
.alert-warning{background:var(--warning-soft);border-color:transparent} .alert-warning .ic{color:var(--warning)}
.alert-danger{background:var(--danger-soft);border-color:transparent} .alert-danger .ic{color:var(--danger)}
.alert-success{background:var(--success-soft);border-color:transparent} .alert-success .ic{color:var(--success)}
.divider{height:1px;background:var(--border);margin:16px 0;border:0}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:.93rem}
.kv span:first-child{color:var(--muted)}
.kv.total{font-weight:800;font-size:1.08rem;border-top:1px dashed var(--border);margin-top:6px;padding-top:12px}
.price{font-weight:800;color:var(--text);font-size:1.25rem;white-space:nowrap}
.price-sub{font-size:.78rem;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;border:1.5px solid var(--border);background:var(--surface);cursor:pointer;font-size:.88rem;font-weight:600;color:var(--text)}
.chip[aria-pressed="true"],.chip.active{background:var(--navy);border-color:var(--navy);color:#fff}
:root[data-theme="dark"] .chip[aria-pressed="true"]{background:var(--teal-2);border-color:var(--teal-2)}
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px}
table.table{width:100%;border-collapse:collapse;font-size:.92rem;background:var(--surface)}
.table th,.table td{padding:11px 14px;text-align:start;border-bottom:1px solid var(--border);vertical-align:top}
.table th{background:var(--surface-2);font-weight:700;font-size:.82rem;color:var(--muted);white-space:nowrap}
.table tr:last-child td{border-bottom:0}

/* ---------- Demo bar ---------- */
.demo-bar{background:repeating-linear-gradient(45deg,#1b1503,#1b1503 12px,#241c05 12px,#241c05 24px);color:#F5E3B0;font-size:.82rem}
.demo-bar .container{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:6px}
.demo-bar strong{color:var(--gold)}
.demo-bar .seg{display:inline-flex;border:1px solid #6b5418;border-radius:8px;overflow:hidden}
.demo-bar .seg button{background:transparent;border:0;color:#F5E3B0;padding:4px 12px;cursor:pointer;font-size:.8rem}
.demo-bar .seg button[aria-pressed="true"]{background:var(--gold);color:#1b1503;font-weight:700}
.demo-bar .dbtn{background:transparent;border:1px solid #6b5418;color:#F5E3B0;border-radius:8px;padding:4px 10px;cursor:pointer;font-size:.8rem}
.demo-bar .dbtn:hover{border-color:var(--gold)}
.demo-bar .spacer{flex:1}
@media (max-width:700px){.demo-bar .xsmall,.demo-bar .spacer{display:none}.demo-bar .container{gap:6px}}

/* ---------- Header ---------- */
.site-header{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--border)}
.header-inner{display:flex;align-items:center;gap:18px;height:70px}
.brand{display:flex;align-items:center;gap:10px;color:var(--text);text-decoration:none!important;flex-shrink:0}
.brand svg{width:42px;height:42px}
.brand-text{display:flex;flex-direction:column;line-height:1.1}
.brand-text strong{font-size:1.12rem;letter-spacing:.2px;color:var(--navy)}
:root[data-theme="dark"] .brand-text strong{color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .brand-text strong{color:#fff}}
.brand-text small{font-size:.7rem;color:var(--gold-2);font-weight:650;letter-spacing:.3px}
.main-nav{display:flex;gap:2px;flex:1;justify-content:center;flex-wrap:nowrap}
.main-nav a{padding:8px 11px;border-radius:9px;color:var(--text);font-weight:600;font-size:.9rem;white-space:nowrap;text-decoration:none!important}
.main-nav a:hover{background:var(--surface-2)}
.main-nav a.active{color:var(--primary);background:var(--teal-soft)}
.header-tools{display:flex;align-items:center;gap:8px}
.tool-btn{height:38px;min-width:38px;padding:0 10px;border-radius:10px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--text);font-size:.85rem}
.tool-btn:hover{border-color:var(--primary);color:var(--primary)}
.cur-select{height:38px;border-radius:10px;border:1px solid var(--border);background:var(--surface);padding:0 8px;font-weight:700;font-size:.85rem;cursor:pointer;color:var(--text)}
.nav-toggle{display:none}
@media (max-width:1140px){
  .nav-toggle{display:inline-grid}
  .main-nav{position:absolute;top:70px;inset-inline:0;background:var(--surface);flex-direction:column;padding:10px 16px 16px;border-bottom:1px solid var(--border);box-shadow:var(--shadow-lg);display:none}
  .main-nav.open{display:flex}
  .main-nav a{padding:12px}
  .header-inner{justify-content:space-between}
}
@media (max-width:480px){.header-tools{gap:5px}.tool-btn{padding:0 8px}#lang-btn .ic{display:none}.cur-select{padding:0 4px}}
@media (max-width:430px){.brand-text{display:none}}
@media (max-width:560px){.brand-text small{display:none}.header-tools .acc-label{display:none}.brand svg{width:36px;height:36px}.header-inner{gap:8px}}

/* ---------- Hero & search widget ---------- */
.hero{position:relative;background:radial-gradient(1200px 500px at 85% -10%,rgba(15,163,163,.45),transparent 60%),radial-gradient(800px 400px at 0% 110%,rgba(212,165,55,.28),transparent 60%),linear-gradient(160deg,#0B2545 0%,#13315C 55%,#0E3B4F 100%);color:#fff;overflow:hidden;padding:56px 0 120px}
.hero h1{color:#fff;max-width:760px}
.hero p.lead{color:#CFE0EE;font-size:1.08rem;max-width:640px}
.hero .hero-art{position:absolute;inset:auto 0 0 0;height:140px;opacity:.5;pointer-events:none}
.hero-mini{padding:36px 0 90px}
.hero .eyebrow{display:inline-flex;gap:8px;align-items:center;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);padding:5px 12px;border-radius:999px;font-size:.82rem;color:#F5E3B0;margin-bottom:14px}
.search-wrap{margin-top:-90px;position:relative;z-index:2}
.search-widget{background:var(--surface);border-radius:20px;box-shadow:var(--shadow-lg);border:1px solid var(--border);overflow:hidden}
.sw-tabs{display:flex;overflow-x:auto;border-bottom:1px solid var(--border);background:var(--surface-2);scrollbar-width:thin}
.sw-tab{flex:1;min-width:104px;display:flex;flex-direction:column;align-items:center;gap:5px;padding:13px 10px;border:0;background:transparent;cursor:pointer;font-weight:650;font-size:.85rem;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.sw-tab .ic{width:22px;height:22px}
.sw-tab[aria-selected="true"]{color:var(--primary);border-bottom-color:var(--gold);background:var(--surface)}
.sw-panel{padding:20px}
.sw-grid{display:grid;gap:12px;grid-template-columns:repeat(12,minmax(0,1fr));align-items:end}
.c2{grid-column:span 2}.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c8{grid-column:span 8}.c12{grid-column:span 12}
@media (max-width:900px){.sw-grid .c2,.sw-grid .c3,.sw-grid .c4,.sw-grid .c5{grid-column:span 6}.sw-grid .c6,.sw-grid .c8{grid-column:span 12}}
@media (max-width:560px){.sw-grid>*{grid-column:span 12!important}}
.swap-btn{align-self:end;height:44px}
.trip-toggle{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
details.pax{position:relative}
details.pax summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px}
details.pax summary::-webkit-details-marker{display:none}
.pax-pop{position:absolute;z-index:20;top:calc(100% + 6px);inset-inline-start:0;min-width:270px;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-lg);padding:14px}
.pax-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;gap:10px}
.pax-row + .pax-row{border-top:1px solid var(--border)}

/* ---------- Sections ---------- */
.section{padding:56px 0}
.section-sm{padding:32px 0}
.section-head{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.section-head p{margin:0}
.eyebrow-dark{color:var(--gold-2);font-weight:750;font-size:.8rem;letter-spacing:.6px;text-transform:uppercase;margin-bottom:6px;display:block}
.trust-bar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.trust-item{display:flex;gap:12px;align-items:center;padding:16px;background:var(--surface);border:1px solid var(--border);border-radius:14px}
.trust-item .ic{color:var(--teal-2);width:30px;height:30px}
:root[data-theme="dark"] .trust-item .ic{color:var(--teal)}
@media (max-width:860px){.trust-bar{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.trust-bar{grid-template-columns:1fr}}
.media{position:relative;aspect-ratio:16/10;overflow:hidden;border-radius:var(--radius) var(--radius) 0 0;background:var(--surface-2)}
.media svg{width:100%;height:100%;display:block}
.media .media-badge{position:absolute;top:12px;inset-inline-start:12px}
.media .media-badge-end{position:absolute;top:12px;inset-inline-end:12px}
.dest-card{position:relative;border-radius:var(--radius);overflow:hidden;aspect-ratio:4/5;display:block;color:#fff;text-decoration:none!important}
.dest-card svg{position:absolute;inset:0;width:100%;height:100%}
.dest-card .dest-info{position:absolute;inset:auto 0 0 0;padding:16px;background:linear-gradient(transparent,rgba(5,15,30,.85))}
.dest-card h3{color:#fff;margin:0}
.feature{display:flex;gap:14px;align-items:flex-start}
.feature .f-ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--teal-soft);color:var(--teal-2);flex-shrink:0}
.feature .f-ic.gold{background:var(--gold-soft);color:var(--gold-2)}
.quote{font-size:.98rem}

/* ---------- Accordion ---------- */
.acc-item{border:1px solid var(--border);border-radius:14px;background:var(--surface);overflow:hidden}

.acc-btn{width:100%;text-align:start;display:flex;justify-content:space-between;gap:12px;align-items:center;padding:16px 18px;background:transparent;border:0;cursor:pointer;font-weight:700;font-size:.98rem;color:var(--text)}

mark{background:var(--gold-soft);color:inherit;border-radius:3px;padding:0 2px}

/* ---------- Account ---------- */
.account-layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:24px;align-items:start}

/* ---------- Modal / toast ---------- */
.modal-backdrop{position:fixed;inset:0;background:rgba(4,12,24,.6);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .15s}

.toast-root{position:fixed;bottom:20px;left:0;right:0;margin:0 auto;z-index:300;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:calc(100% - 32px);max-width:460px}
.toast{background:var(--navy);color:#fff;padding:12px 16px;border-radius:12px;box-shadow:var(--shadow-lg);font-size:.92rem;display:flex;gap:10px;align-items:center;pointer-events:auto;animation:pop .2s;width:100%}
.toast.success{background:#11633F}.toast.error{background:#9B2A22}

@keyframes shimmer{to{background-position:-200% 0}}

/* ---------- Email preview ---------- */
.email-shell{background:#EEF2F6;border-radius:14px;padding:16px;color:#0F1B2D}

.ai-fab{position:fixed;bottom:22px;inset-inline-end:22px;z-index:120;width:60px;height:60px;border-radius:50%;border:0;cursor:pointer;background:linear-gradient(135deg,var(--teal-2),var(--navy-2));color:#fff;box-shadow:0 10px 30px rgba(11,37,69,.4);display:grid;place-items:center}

.typing span{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--muted);margin:0 2px;animation:blink 1s infinite}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{50%{opacity:.2}}

/* ---------- Footer ---------- */
.site-footer{background:#081A33;color:#AFC2D6;padding:50px 0 24px;margin-top:40px}

.footer-grid{display:grid;grid-template-columns:1.5fr 1fr 1fr 1.2fr;gap:28px}

@media (max-width:860px){.footer-grid{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.footer-grid{grid-template-columns:1fr}}
.pay-badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

.footer-bottom{border-top:1px solid rgba(255,255,255,.1);margin-top:30px;padding-top:18px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:.82rem}
.compare-table th:first-child,.compare-table td:first-child{position:sticky;inset-inline-start:0;background:var(--surface-2);z-index:1}
.how-steps{counter-reset:step;display:grid;gap:18px;grid-template-columns:repeat(5,minmax(0,1fr))}

.how-step{position:relative;padding:22px 18px 18px;background:var(--surface);border:1px solid var(--border);border-radius:16px}
.how-step::before{counter-increment:step;content:counter(step);position:absolute;top:-14px;inset-inline-start:18px;width:30px;height:30px;border-radius:50%;background:var(--gold);color:#1d1503;font-weight:800;display:grid;place-items:center}
.stat{font-size:2rem;font-weight:800;color:var(--teal-2)}

@media print{.demo-bar,.site-header,.site-footer,.ai-fab,.ai-panel,.no-print{display:none!important}body{background:#fff}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

<script>
'use strict';
/* =====================================================================

   ===================================================================== */
const CONFIG = {

};

/* =====================================================================
   2) UTILITIES
   ===================================================================== */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clone = (o) => (o === undefined ? undefined : JSON.parse(JSON.stringify(o)));

const store = { schema: 1, bookings: [], leads: [], wallets: [], users: [], travellers: {}, outbox: [], newsletter: [] };

function persist() { safeStorage.set(CONFIG.STORAGE_KEY, JSON.stringify(store)); }

function loadStore() {
  const raw = safeStorage.get(CONFIG.STORAGE_KEY);
  if (raw) {
    try {
      const d = JSON.parse(raw);
      if (d && Array.isArray(d.bookings) && Array.isArray(d.users)) { Object.assign(store, d); return; }
    } catch (e) { /* corrupted → reseed */ }
  }
  seedStore();
  persist();
}

const REF_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function yymmdd(d) { return String(d.getFullYear()).slice(2) + pad(d.getMonth() + 1) + pad(d.getDate()); }
/** Reference format: PG-YYMMDD-XXXX (unique within the store). */
function genRef(date = new Date()) {
  let ref;
  do { let x = ''; for (let i = 0; i < 4; i++) x += REF_CHARS[Math.floor(Math.random() * REF_CHARS.length)]; ref = `PG-${yymmdd(date)}-${x}`; }
  while (store.bookings.some(b => b.ref === ref));
  return ref;
}
const genPNR = () => { let s = ''; for (let i = 0; i < 6; i++) s += REF_CHARS[Math.floor(Math.random() * REF_CHARS.length)]; return s; };

/** Builds a booking strictly following the shared contract. */
function makeBooking(o) {
  const at = o.createdAt || new Date().toISOString();
  return {
    ref: o.ref || genRef(new Date(at)),
    service: o.service,
    status: o.status || 'new',
    customer: { name: o.customer.name, email: String(o.customer.email || '').toLowerCase(), phone: o.customer.phone, userId: o.customer.userId || null },
    items: o.items || [],
    travellers: o.travellers || [],
    amount: o.amount,
    currency: o.currency,
    tax: o.tax,
    payment: o.payment || { provider: null, status: 'unpaid', txnId: null },
    notes: o.notes || [],
    timeline: o.timeline || [{ status: 'new', at, by: o.by || 'customer' }],
    createdAt: at
  };
}

function exportState() {
  return JSON.stringify({ source: 'pacific-gulf-web', schema: 1, exportedAt: new Date().toISOString(), bookings: store.bookings, leads: store.leads, wallets: store.wallets }, null, 2);
}
/**
 * Upserts bookings (by ref), leads (by id) and wallets (by userId) from JSON (string or object).
 * Validates enums from the shared contract. Returns counts.
 */
function importState(json) {
  const d = typeof json === 'string' ? JSON.parse(json) : json;
  if (!d || typeof d !== 'object') throw new Error('Invalid JSON payload');
  const counts = { bookings: 0, leads: 0, wallets: 0, skipped: 0 };
  (Array.isArray(d.bookings) ? d.bookings : []).forEach(b => {
    if (!b || !/^PG-\d{6}-[A-Z0-9]{4}$/.test(b.ref) || !SERVICES.includes(b.service) || !STATUSES.includes(b.status)) { counts.skipped++; return; }
    const i = store.bookings.findIndex(x => x.ref === b.ref);
    if (i >= 0) store.bookings[i] = b; else store.bookings.unshift(b);
    counts.bookings++;
  });
  (Array.isArray(d.leads) ? d.leads : []).forEach(l => {
    if (!l || !l.id || !LEAD_TYPES.includes(l.type) || !LEAD_STATUSES.includes(l.status)) { counts.skipped++; return; }
    const i = store.leads.findIndex(x => x.id === l.id);
    if (i >= 0) store.leads[i] = l; else store.leads.unshift(l);
    counts.leads++;
  });
  (Array.isArray(d.wallets) ? d.wallets : []).forEach(w => {
    if (!w || !w.userId || typeof w.balance !== 'number') { counts.skipped++; return; }
    const i = store.wallets.findIndex(x => x.userId === w.userId);
    if (i >= 0) store.wallets[i] = w; else store.wallets.push(w);
    counts.wallets++;
  });
  persist();
  state.cache = {};
  if (typeof rerender === 'function') rerender();
  return counts;
}
window.exportState = exportState;
window.importState = importState;

/* ---- Flight generation (deterministic per route/date) ---- */
function haversine(a, b) {
  const R = 6371, toR = (x) => x * Math.PI / 180;
  const dLat = toR(b.lat - a.lat), dLon = toR(b.lon - a.lon);
  const s = Math.sin(dLat / 2) ** 2 + Math.cos(toR(a.lat)) * Math.cos(toR(b.lat)) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(s));
}
const flightMinutes = (km) => Math.round(km / 780 * 60 + 35);
const offersCache = {};   // offerId → offer (simulates provider session)

function buildLeg(al, from, to, r, depMin) {
  const A = AP[from], Bp = AP[to];
  const direct = al.hub === from || al.hub === to;
  const segs = [];
  let t = depMin;
  const mkSeg = (f, tt) => { const d = flightMinutes(haversine(AP[f], AP[tt])); const s = { from: f, to: tt, dep: t, arr: t + d, duration: d, flightNo: `${al.code} ${100 + Math.floor(r() * 880)}` }; t += d; return s; };
  if (direct) segs.push(mkSeg(from, to));
  else { segs.push(mkSeg(from, al.hub)); t += 70 + Math.floor(r() * 120); segs.push(mkSeg(al.hub, to)); }
  return { segments: segs, stops: segs.length - 1, dep: depMin, arr: t, duration: t - depMin, via: direct ? null : al.hub, dist: haversine(A, Bp) };
}

function genFlights(q) {
  const r = seeded(`${q.from}${q.to}${q.date}${q.ret || ''}${q.cabin}`);
  const A = AP[q.from], Bp = AP[q.to], dist = haversine(A, Bp);
  const out = [];
  AIRLINES.forEach(al => {
    const direct = al.hub === q.from || al.hub === q.to;
    if (al.lowCost && dist > 4500) return;
    if (!direct) {
      const H = AP[al.hub];
      if (haversine(A, H) + haversine(H, Bp) > dist * 1.6 + 500) return;
    }
    const departures = direct ? 1 + Math.floor(r() * 2) : 1;
    for (let k = 0; k < departures; k++) {
      const dep = 60 * (1 + Math.floor(r() * 22)) + 5 * Math.floor(r() * 11);
      const outbound = buildLeg(al, q.from, q.to, r, dep);
      const inbound = q.trip === 'round' && q.ret ? buildLeg(al, q.to, q.from, r, 60 * (1 + Math.floor(r() * 22))) : null;
      const baseAdt = (18 + dist * 0.052) * CABINS[q.cabin].m * al.f * (outbound.stops ? 0.88 : 1) * (0.9 + r() * 0.3) * (inbound ? 1.85 : 1);
      const adt = round(baseAdt, 3), chd = round(baseAdt * 0.75, 3), inf = round(baseAdt * 0.1, 3);
      const total = round(adt * q.adt + chd * q.chd + inf * q.inf, 3);
      const offer = {
        id: `OF-${al.code}-${k}-${Math.floor(r() * 1e6)}`, airline: al.code, cabin: q.cabin, outbound, inbound,
        baggage: al.lowCost ? (q.cabin === 'economy' ? '7kg' : '20kg') : (q.cabin === 'economy' ? '30kg' : '40kg'),
        refundable: !al.lowCost && r() > 0.45, seatsLeft: 2 + Math.floor(r() * 8),
        fare: { adt, chd, inf }, total, query: { ...q }
      };
      offersCache[offer.id] = offer;
      out.push(offer);
    }
  });
  return out;
}

/* ---- Hotels ---- */
function hotelNightly(h, roomType, meal, refundable, q) {
  const r = seeded(h.id + q.checkIn);
  const season = 0.92 + r() * 0.2;
  const occ = (q.adults / Math.max(1, q.rooms)) > 2 ? 1.15 : 1;
  return round(h.base * roomType.m * MEALS[meal].m * (refundable ? 1 : 0.88) * season * occ, 3);
}
/** Cancellation policy: list of windows with dates & fees (OMR, for the whole stay). */
function cancellationPolicy(nightly, nights, rooms, checkIn, refundable) {
  const total = round(nightly * nights * rooms, 3), oneNight = round(nightly * rooms, 3);
  const today = todayISO();
  if (!refundable) return [{ from: today, to: checkIn, fee: total, kind: 'nonref' }];
  const free = addDays(checkIn, -7), partial = addDays(checkIn, -2);
  const pol = [];
  if (free > today) pol.push({ from: today, to: free, fee: 0, kind: 'free' });
  if (partial > today) pol.push({ from: free > today ? free : today, to: partial, fee: oneNight, kind: 'partial' });
  pol.push({ from: partial > today ? partial : today, to: checkIn, fee: total, kind: 'full' });
  return pol;
}
function hotelRates(h, q) {
  const nights = Math.max(1, daysBetween(q.checkIn, q.checkOut));
  return ROOM_TYPES.filter(rt => !rt.minStars || h.stars >= rt.minStars).map(rt => ({
    id: rt.id, name: rt.name, beds: rt.beds, size: rt.size,
    rates: [['RO', false], ['RO', true], ['BB', true], ['HB', true]].concat(h.stars === 5 ? [['FB', true]] : []).map(([meal, refundable]) => {
      const nightly = hotelNightly(h, rt, meal, refundable, q);
      return { rateId: `${h.id}|${rt.id}|${meal}|${refundable ? 'R' : 'N'}`, meal, refundable, nightly, total: round(nightly * nights * q.rooms, 3), policy: cancellationPolicy(nightly, nights, q.rooms, q.checkIn, refundable) };
    })
  }));
}
const minHotelPrice = (h, q) => Math.min(...hotelRates(h, q).flatMap(r => r.rates.map(x => x.total)));

/* ---- Notifications (simulated email + SMS) ---- */
function queueNotification(kind, payload) {
  const msg = { id: uid('MSG-'), kind, at: new Date().toISOString(), ...payload };
  store.outbox.unshift(msg);
  store.outbox = store.outbox.slice(0, 50);
  persist();
  return msg;
}

/* ---- Cancellation quote ---- */
function cancellationQuote(b) {
  if (!['new', 'processing'].includes(b.status)) return { allowed: false };
  const item = b.items[0] || {};
  let feeRatio = 0, reason = '';
  if (b.service === 'hotel') {
    const pol = item.policy || [];
    const today = todayISO();
    const win = pol.find(p => today >= p.from && today < p.to) || pol[pol.length - 1];
    const stayTotal = item.stayTotalOMR || 1;
    feeRatio = win ? clamp(win.fee / stayTotal, 0, 1) : 0;
    reason = win ? win.kind : 'free';
  } else if (b.service === 'air') { feeRatio = item.refundable ? 0.1 : 0.25; reason = 'fare'; }
  else if (b.service === 'holiday') { feeRatio = daysBetween(todayISO(), item.departure || todayISO()) > 14 ? 0.1 : 0.5; reason = 'holiday'; }
  else if (b.service === 'visa') { feeRatio = b.status === 'new' ? 0 : 1; reason = 'visa'; }
  else { feeRatio = 0; reason = 'free'; }
  if (feeRatio === 0) reason = 'free';
  const fee = round(b.amount * feeRatio, DECIMALS[b.currency]);
  return { allowed: true, fee, refund: round(b.amount - fee, DECIMALS[b.currency]), currency: b.currency, method: b.payment.provider === 'wallet' ? 'wallet' : 'card', reason };
}

   11) UI PRIMITIVES — modal (focus-trapped), toast, loaders, steppers
   ===================================================================== */
const modalStack = [];
/**
 * openModal({ title, body, actions:[{label, cls, onClick(close), id}], size, onClose, onOpen })
 * Returns a close() function. Esc / backdrop close; focus returns to trigger.
 */
function openModal(opts) {
  const root = $('#modal-root');
  const prevFocus = document.activeElement;
  const id = 'm' + Math.random().toString(36).slice(2, 8);
  const wrap = document.createElement('div');
  wrap.className = 'modal-backdrop';
  wrap.innerHTML = `<div class="modal ${opts.size || ''}" role="dialog" aria-modal="true" aria-labelledby="${id}-t">
    <div class="modal-head"><h2 id="${id}-t">${opts.title}</h2>${opts.noClose ? '' : `<button class="icon-btn" data-close aria-label="${t('close')}">${icon('x')}</button>`}</div>
    <div class="modal-body">${opts.body}</div>
    ${opts.actions && opts.actions.length ? `<div class="modal-foot">${opts.actions.map((a, i) => `<button type="button" class="btn ${a.cls || 'btn-outline'}" data-act="${i}" ${a.id ? `id="${a.id}"` : ''}>${a.label}</button>`).join('')}</div>` : ''}
  </div>`;
  root.appendChild(wrap);
  let closed = false;
  const close = (reason) => {
    if (closed) return; closed = true;
    wrap.remove();
    const i = modalStack.indexOf(entry); if (i >= 0) modalStack.splice(i, 1);
    document.removeEventListener('keydown', onKey);
    if (opts.onClose) opts.onClose(reason);
    if (prevFocus && document.body.contains(prevFocus)) { try { prevFocus.focus(); } catch (e) { /* noop */ } }
  };
  const onKey = (e) => {
    if (modalStack[modalStack.length - 1] !== entry) return;
    if (e.key === 'Escape' && !opts.noClose) { e.preventDefault(); close('esc'); }
    if (e.key === 'Tab') {   // basic focus trap
      const f = $$('button:not([disabled]),[href],input:not([disabled]),select,textarea,[tabindex]:not([tabindex="-1"])', wrap).filter(x => x.offsetParent !== null);
      if (!f.length) return;
      const first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  };
  const entry = { close };
  modalStack.push(entry);
  document.addEventListener('keydown', onKey);
  wrap.addEventListener('mousedown', (e) => { if (e.target === wrap && !opts.noClose) close('backdrop'); });
  $$('[data-close]', wrap).forEach(b => b.addEventListener('click', () => close('x')));
  (opts.actions || []).forEach((a, i) => { const btn = $(`[data-act="${i}"]`, wrap); btn.addEventListener('click', () => a.onClick ? a.onClick(close, btn, wrap) : close('action')); });
  const focusable = $('input,select,textarea,.modal-foot .btn-primary,.modal-foot .btn,button', wrap);
  setTimeout(() => focusable && focusable.focus(), 30);
  if (opts.onOpen) opts.onOpen(wrap, close);
  return close;
}
function closeAllModals() { while (modalStack.length) modalStack[modalStack.length - 1].close('route'); }

function confirmModal({ title, body, confirmLabel, danger }) {

/** Field helper with label/error wiring for accessibility. */
function field({ name, label, type = 'text', value = '', required, placeholder, options, cls = '', attrs = '', hint, ltr }) {
  const id = 'f-' + name.replace(/[^a-z0-9]/gi, '-');

  else control = `<input id="${id}" name="${name}" type="${type}" class="input ${ltr ? 'ltr' : ''}" value="${esc(value)}" ${required ? 'required' : ''} placeholder="${esc(placeholder || '')}" ${attrs} aria-describedby="${id}-e">`;

/** Show/clear validation errors on a form: errors = { name: message } */
function showErrors(form, errors) {
  $$('[aria-invalid]', form).forEach(el => el.removeAttribute('aria-invalid'));
  $$('.err', form).forEach(el => { el.textContent = ''; });
  let first = null;
  Object.keys(errors).forEach(name => {
    const el = form.querySelector(`[name="${CSS.escape(name)}"]`);
    if (!el) return;
    el.setAttribute('aria-invalid', 'true');
    const e = document.getElementById(el.getAttribute('aria-describedby'));
    if (e) e.textContent = errors[name];
    if (!first) first = el;
  });
  if (first) { first.focus(); first.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
  return !first;
}

/* =====================================================================
   13) ROUTER — hash based (#/path?query)
   ===================================================================== */
function parseHash() {
  const h = location.hash.replace(/^#/, '') || '/';
  const [path, qs] = h.split('?');
  return { path: path || '/', query: Object.fromEntries(new URLSearchParams(qs || '')) };
}
const qs = (o) => new URLSearchParams(Object.entries(o).filter(([, v]) => v !== '' && v != null)).toString();
const ROUTES = [];
const route = (pattern, handler, title) => ROUTES.push({ re: new RegExp('^' + pattern.replace(/:(\w+)/g, '([^/]+)') + '$'), keys: (pattern.match(/:(\w+)/g) || []).map(k => k.slice(1)), handler, title });
let routeToken = 0;
const app = () => $('#app');
function view(html) { app().innerHTML = html; }

async function router() {
  const token = ++routeToken;
  closeAllModals();
  const { path, query } = parseHash();
  let match = null, params = {};
  for (const r of ROUTES) { const m = path.match(r.re); if (m) { match = r; r.keys.forEach((k, i) => { params[k] = decodeURIComponent(m[i + 1]); }); break; } }
  renderHeader();
  const nav = $('#main-nav'); if (nav) nav.classList.remove('open');
  const ctx = { params, query, path, token, stale: () => token !== routeToken };
  if (!match) { view(pageNotFound()); document.title = 'Pacific Gulf'; return; }
  document.title = `${typeof match.title === 'function' ? match.title(ctx) : t(match.title)} | Pacific Gulf`;
  try { await match.handler(ctx); }
  catch (e) { if (!ctx.stale()) { console.warn(e); view(`<div class="container section">${alertBox('danger', errMsg(e))}</div>`); } }
}
let lastPathForScroll = null;
function onHashChange() {
  const p = parseHash().path;
  if (p !== lastPathForScroll) { window.scrollTo(0, 0); lastPathForScroll = p; }
  router().then(() => { if (p !== lastPathForScroll) return; });
}

function bindSearchWidget(root) {
  if (!root) return;
  // Tabs (arrow-key navigation per WAI-ARIA)
  const tabs = $$('[role="tab"]', root);
  const select = (s, focus) => {
    swState.tab = s;
    tabs.forEach(tb => { const on = tb.dataset.tab === s; tb.setAttribute('aria-selected', on); tb.tabIndex = on ? 0 : -1; if (on && focus) tb.focus(); });
    $$('[role="tabpanel"]', root).forEach(p => { p.hidden = p.id !== 'swp-' + s; });
  };
  tabs.forEach((tb, i) => {
    tb.addEventListener('click', () => select(tb.dataset.tab));
    tb.addEventListener('keydown', (e) => {
      const dir = (e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0) * (state.lang === 'ar' ? -1 : 1);
      if (dir) { e.preventDefault(); select(tabs[(i + dir + tabs.length) % tabs.length].dataset.tab, true); }
    });
  });
  // --- Air ---
  const aq = swState.air, fAir = $('#sw-air', root);
  $$('[data-trip]', fAir).forEach(b => b.addEventListener('click', () => {
    aq.trip = b.dataset.trip;
    $$('[data-trip]', fAir).forEach(x => { x.setAttribute('aria-pressed', x === b); x.setAttribute('aria-checked', x === b); });
    $('#a-ret', fAir).disabled = aq.trip === 'oneway';
  }));
  $('#a-swap', fAir).addEventListener('click', () => { const f = $('#a-from', fAir), to = $('#a-to', fAir); const v = f.value; f.value = to.value; to.value = v; aq.from = f.value; aq.to = to.value; });
  $('#a-date', fAir).addEventListener('change', (e) => { const r = $('#a-ret', fAir); r.min = e.target.value; if (r.value < e.target.value) r.value = addDays(e.target.value, 7); });
  const refreshPax = () => {
    ['adt', 'chd', 'inf'].forEach(k => { $('#cnt-' + k, fAir).textContent = aq[k]; });
    const lim = { adt: [1, 9], chd: [0, 8], inf: [0, aq.adt] };
    $$('[data-cnt]', fAir).forEach(b => { const k = b.dataset.cnt, d = +b.dataset.d; b.disabled = d < 0 ? aq[k] <= lim[k][0] : aq[k] >= lim[k][1] || (aq.adt + aq.chd >= 9 && k !== 'inf'); });
    $('#pax-sum', fAir).innerHTML = `${paxSummary(aq)} ${icon('chevron')}`;
  };
  $$('[data-cnt]', fAir).forEach(b => b.addEventListener('click', () => { const k = b.dataset.cnt; aq[k] = Math.max(0, aq[k] + (+b.dataset.d)); if (aq.inf > aq.adt) aq.inf = aq.adt; refreshPax(); }));
  $('#a-cabin', fAir).addEventListener('change', (e) => { aq.cabin = e.target.value; refreshPax(); });
  $('#pax-done', fAir).addEventListener('click', () => { $('#pax-d', fAir).open = false; $('#pax-sum', fAir).focus(); });
  fAir.addEventListener('submit', (e) => {
    e.preventDefault();
    const d = formData(fAir); Object.assign(aq, { from: d.from, to: d.to, date: d.date, ret: aq.trip === 'round' ? $('#a-ret', fAir).value : '' });
    const err = $('#sw-air-err', fAir);
    if (aq.from === aq.to) { err.textContent = t('err_sameAirport'); return; }
    if (!validISO(aq.date) || aq.date < todayISO()) { err.textContent = t('err_date'); return; }
    if (aq.trip === 'round' && (!validISO(aq.ret) || aq.ret < aq.date)) { err.textContent = t('err_returnDate'); return; }
    err.textContent = '';
    go('#/search/air?' + qs({ trip: aq.trip, from: aq.from, to: aq.to, date: aq.date, ret: aq.trip === 'round' ? aq.ret : '', adt: aq.adt, chd: aq.chd, inf: aq.inf, cabin: aq.cabin }));
  });
  // --- Hotel ---
  const fH = $('#sw-hotel', root);
  $('#h-in', fH).addEventListener('change', (e) => { const o = $('#h-out', fH); o.min = addDays(e.target.value, 1); if (o.value <= e.target.value) o.value = addDays(e.target.value, 3); });
  fH.addEventListener('submit', (e) => {
    e.preventDefault(); const d = formData(fH); const err = $('#sw-hotel-err', fH);
    if (!validISO(d.checkIn) || d.checkIn < todayISO()) { err.textContent = t('err_date'); return; }
    if (!validISO(d.checkOut) || d.checkOut <= d.checkIn) { err.textContent = t('err_checkout'); return; }
    if (daysBetween(d.checkIn, d.checkOut) > 30) { err.textContent = t('err_maxNights'); return; }
    Object.assign(swState.hotel, d);
    go('#/search/hotel?' + qs(d));
  });
  // --- Holiday ---
  $('#sw-holiday', root).addEventListener('submit', (e) => { e.preventDefault(); const d = formData(e.target); go(d.pkg ? `#/holiday/${d.pkg}?month=${d.month}` : `#/holidays?month=${d.month}`); });
  // --- Car ---
  const fC = $('#sw-car', root);
  $('#c-pd', fC).addEventListener('change', (e) => { const o = $('#c-dd', fC); o.min = e.target.value; if (o.value <= e.target.value) o.value = addDays(e.target.value, 3); });
  fC.addEventListener('submit', (e) => {
    e.preventDefault(); const d = formData(fC); const err = $('#sw-car-err', fC);
    if (!d.age) { err.textContent = t('err_driverAge'); return; }
    if (!validISO(d.pickDate) || d.pickDate < todayISO()) { err.textContent = t('err_date'); return; }
    if (!validISO(d.dropDate) || d.dropDate < d.pickDate || (d.dropDate === d.pickDate && d.dropTime <= d.pickTime)) { err.textContent = t('err_dropoff'); return; }
    Object.assign(swState.car, d);
    go('#/search/car?' + qs(d));
  });
  $('#sw-hajj', root).addEventListener('submit', (e) => { e.preventDefault(); const d = formData(e.target); go('#/hajj' + (d.type ? '?type=' + d.type : '')); });
  $('#sw-visa', root).addEventListener('submit', (e) => { e.preventDefault(); go('#/visa/' + formData(e.target).visa); });
}

/** Cached search call: avoids re-fetch (and loader flash) on lang/currency switch. */
async function cached(key, fn) { if (state.cache[key]) return state.cache[key]; const r = await fn(); state.cache[key] = r; return r; }
function modifySearchBar(summaryHtml, tab) {
  return `<div class="card card-body mb-2 no-print"><div class="row-between"><div>${summaryHtml}</div><button type="button" class="btn btn-outline btn-sm" id="mod-btn" aria-expanded="false" aria-controls="mod-wrap">${icon('edit')} ${t('modifySearch')}</button></div><div id="mod-wrap" class="mt-2" hidden>${searchWidget(tab)}</div></div>`;
}
function bindModifySearch() {
  const b = $('#mod-btn'); if (!b) return;
  b.addEventListener('click', () => { const w = $('#mod-wrap'); w.hidden = !w.hidden; b.setAttribute('aria-expanded', String(!w.hidden)); });
  bindSearchWidget($('#mod-wrap .search-widget'));
}

function parseAirQ(q) {
  const r = { trip: q.trip === 'oneway' ? 'oneway' : 'round', from: q.from, to: q.to, date: q.date, ret: q.ret || '', adt: clamp(+q.adt || 1, 1, 9), chd: clamp(+q.chd || 0, 0, 8), inf: clamp(+q.inf || 0, 0, 9), cabin: CABINS[q.cabin] ? q.cabin : 'economy' };
  r.inf = Math.min(r.inf, r.adt);
  if (r.trip === 'oneway') r.ret = '';
  return r;
}
async function pageAirResults(ctx) {
  const q = parseAirQ(ctx.query);
  if (!AP[q.from] || !AP[q.to] || !validISO(q.date)) { go('#/flights'); return; }
  swState.air = { ...q, ret: q.ret || addDays(q.date, 7) }; swState.tab = 'air';
  const key = 'air:' + qs(q);
  const ui = state.ui[key] || (state.ui[key] = { sort: 'price', stops: [], airlines: [], times: [], maxPrice: null, refundable: false });
  const summary = `<div class="bold">${apLabel(q.from)} ${icon(q.trip === 'round' ? 'swap' : 'arrow', 'flip-rtl')} ${apLabel(q.to)}</div><div class="small muted">${fmtDate(q.date)}${q.ret ? ' — ' + fmtDate(q.ret) : ''} · ${paxSummary(q)}</div>`;
  view(`<div class="container section-sm">${modifySearchBar(summary, 'air')}<div id="air-res">${skeletonList(4, 130)}</div></div>`);
  bindModifySearch();
  let data;
  try { data = await cached(key, () => api.flights.search(q)); } catch (e) { if (!ctx.stale()) $('#air-res').innerHTML = alertBox('danger', errMsg(e)); return; }
  if (ctx.stale()) return;
  const all = data.results;
  const maxAll = Math.ceil(Math.max(...all.map(o => o.total)));
  if (ui.maxPrice == null) ui.maxPrice = maxAll;
  const bucket = (m) => m < 360 ? 'night' : m < 720 ? 'morning' : m < 1080 ? 'afternoon' : 'evening';
  const usedAirlines = [...new Set(all.map(o => o.airline))];
  $('#air-res').innerHTML = `<div class="results-layout">
    <aside class="filters card" id="filters" aria-label="${t('filters')}"><div class="card-body">
      <div class="row-between"><h2 class="mb-0" style="font-size:1.05rem">${icon('filter')} ${t('filters')}</h2><button class="btn btn-ghost btn-sm" id="f-reset">${t('reset')}</button></div>
      <fieldset style="border:0;padding:0;margin:0"><legend class="filter-title">${t('stops')}</legend>
        <label class="check"><input type="checkbox" data-f="stops" value="0" ${ui.stops.includes('0') ? 'checked' : ''}> ${t('nonstop')}</label>
        <label class="check"><input type="checkbox" data-f="stops" value="1" ${ui.stops.includes('1') ? 'checked' : ''}> ${t('oneStop')}</label></fieldset>

function startFlightCheckout(o, ctx) {
  const q = o.query, al = AIRLINES.find(a => a.code === o.airline);
  const lines = [];
  if (q.adt) lines.push({ label: () => `${t('adult')} × ${q.adt}`, omr: o.fare.adt * q.adt });
  if (q.chd) lines.push({ label: () => `${t('child')} × ${q.chd}`, omr: o.fare.chd * q.chd });
  if (q.inf) lines.push({ label: () => `${t('infant')} × ${q.inf}`, omr: o.fare.inf * q.inf });
  state.checkout = {
    service: 'air', back: '#/search/air?' + qs(q),
    title: () => `${L(al.name)} · ${apLabel(q.from)} ${ARW()} ${apLabel(q.to)}`,
    subtitle: () => `${fmtDate(q.date)}${q.ret ? ' — ' + fmtDate(q.ret) : ''} · ${L(CABINS[o.cabin])} · ${o.outbound.stops ? t('oneStop') : t('nonstop')}`,

  };

}

function holidayDepartures(h, month) {
  const out = []; let d = todayISO(); d = addDays(d, 10);
  const r = seeded(h.id); const wd = Math.floor(r() * 7);
  while (parseISO(d).getDay() !== wd) d = addDays(d, 1);
  for (let i = 0; i < 10; i++) { out.push(addDays(d, i * 7)); }
  return month ? (out.filter(x => x.startsWith(month)).length ? out.filter(x => x.startsWith(month)) : out) : out;
}

      ${field({ name: 'firstName', label: t('firstNamePassport'), required: true, value: f.firstName || '', ltr: true, placeholder: 'AHMED' })}
      ${field({ name: 'lastName', label: t('lastNamePassport'), required: true, value: f.lastName || '', ltr: true, placeholder: 'AL HARTHY' })}
      ${field({ name: 'dob', label: t('dob'), type: 'date', required: true, value: f.dob || '', attrs: `max="${todayISO()}"` })}
      ${field({ name: 'nationality', label: t('nationality'), type: 'select', options: NATIONALITIES.map(n => [n[0], state.lang === 'ar' ? n[1] : n[2]]), value: f.nationality })}
      ${field({ name: 'passportNo', label: t('passportNo'), required: true, value: f.passportNo || '', ltr: true })}
      ${field({ name: 'passportExpiry', label: t('passportExpiry'), type: 'date', required: true, value: f.passportExpiry || '' })}
      ${field({ name: 'travelDate', label: t('travelDate'), type: 'date', required: true, value: f.travelDate || addDays(todayISO(), 21), attrs: `min="${addDays(todayISO(), 3)}"` })}
      ${field({ name: 'email', label: t('email'), type: 'email', required: true, value: f.email || '', ltr: true })}
      ${field({ name: 'phone', label: t('phone'), type: 'tel', required: true, value: f.phone || '', ltr: true })}
      </div><div class="row mt-2"><button type="button" class="btn btn-outline" id="v-back">${icon('back', 'flip-rtl')} ${t('back')}</button><button class="btn btn-primary" type="submit">${t('continue')} ${icon('arrow', 'flip-rtl')}</button></div></form>`; }
    if (st.step === 2) body = `<h2 class="mt-0" style="font-size:1.2rem">${t('uploadDocs')}</h2><p class="small muted">${t('uploadHint')}</p>

        <input type="file" id="up-${k}" data-doc="${k}" accept="image/jpeg,image/png,application/pdf" class="sr-only">
        <div id="pv-${k}">${st.docs[k] ? docPreview(k, st.docs[k]) : ''}</div><div class="err" id="up-err-${k}" role="alert"></div></div>`).join('')}
      <div class="row mt-2"><button class="btn btn-outline" id="v-back">${icon('back', 'flip-rtl')} ${t('back')}</button><button class="btn btn-primary" id="v-next">${t('continueToPay')} ${icon('arrow', 'flip-rtl')}</button></div>`;

  const docPreview = (k, d) => `<div class="upload-preview">${d.dataUrl && d.type.startsWith('image/') ? `<img src="${d.dataUrl}" alt="${esc(L(VISA_DOCS[k]))}">` : `<div class="file-ic">PDF</div>`}<div style="flex:1;min-width:0"><div class="bold small" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(d.name)}</div><div class="xsmall muted">${(d.size / 1024).toFixed(0)} KB · ${t('uploaded')}</div></div><button type="button" class="icon-btn" data-rm="${k}" aria-label="${t('remove')} ${esc(L(VISA_DOCS[k]))}">${icon('trash')}</button></div>`;

        if (!validISO(d.passportExpiry) || d.passportExpiry < addDays(d.travelDate || todayISO(), 182)) er.passportExpiry = t('err_passportExpiry');
        if (!V.email(d.email)) er.email = t('err_email'); if (!V.phone(d.phone)) er.phone = t('err_phone');

      });
    }
    if (st.step === 2) {
      const handle = (k, file) => {
        const err = $('#up-err-' + k); err.textContent = '';
        if (!file) return;
        if (!/^(image\/(jpeg|png)|application\/pdf)$/.test(file.type)) { err.textContent = t('err_fileType'); return; }
        if (file.size > 5 * 1024 * 1024) { err.textContent = t('err_fileSize'); return; }
        const rd = new FileReader();
        rd.onload = () => { st.docs[k] = { name: file.name, size: file.size, type: file.type, dataUrl: file.type.startsWith('image/') ? rd.result : null }; $('#pv-' + k).innerHTML = docPreview(k, st.docs[k]); };
        rd.onerror = () => { err.textContent = t('err_generic'); };
        rd.readAsDataURL(file);
      };
      $$('[data-doc]').forEach(inp => inp.addEventListener('change', () => handle(inp.dataset.doc, inp.files[0])));
      $$('[data-zone]').forEach(z => {
        z.addEventListener('dragover', (e) => { e.preventDefault(); z.classList.add('drag'); });
        z.addEventListener('dragleave', () => z.classList.remove('drag'));
        z.addEventListener('drop', (e) => { e.preventDefault(); z.classList.remove('drag'); handle(z.dataset.zone, e.dataTransfer.files[0]); });
        z.tabIndex = 0; z.setAttribute('role', 'button');
        z.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('#up-' + z.dataset.zone).click(); } });
      });
      $('#v-body').addEventListener('click', (e) => { const b = e.target.closest('[data-rm]'); if (!b) return; delete st.docs[b.dataset.rm]; $('#pv-' + b.dataset.rm).innerHTML = ''; });
      $('#v-next').onclick = () => {
        let okAll = true; v.docs.forEach(k => { if (!st.docs[k]) { $('#up-err-' + k).textContent = t('err_docRequired'); okAll = false; } });
        if (!okAll) return;
        const a = { ...st.form };
        const documents = v.docs.map(k => ({ type: k, name: st.docs[k].name, size: st.docs[k].size, mime: st.docs[k].type }));
        state.checkout = {
          service: 'visa', back: '#/visa/' + v.id, title: () => `${v.flag} ${L(v.country)} — ${L(v.name)}`, subtitle: () => `${a.firstName} ${a.lastName} · ${t('travelDate')} ${fmtDate(a.travelDate)}`,

          presetContact: { name: `${a.firstName} ${a.lastName}`, email: a.email, phone: a.phone },

          book: (p) => api.visas.book({ ...p, visa: v, application: a, documents }), form: {}, step: 1,
          onDone: () => { delete state.ui['visa:' + v.id]; }
        };
        go('#/checkout');
      };
    }
  };
  view(`${pageHead(`${v.flag} ${esc(L(v.country))}`, esc(L(v.name)), `<a href="#/visa">${t('nav_visa')}</a> / ${esc(L(v.country))}`)}<div class="container section"><div class="card card-body" style="max-width:900px;margin:0 auto" id="v-body"></div></div>`);
  draw();

const TITLES = { adult: ['MR', 'MRS', 'MS'], child: ['MSTR', 'MISS'], infant: ['MSTR', 'MISS'] };

function coPricing(ctx) {
  const cur = state.currency;
  const sub = conv(ctx.baseOMR, cur);
  const tax = round(sub * CONFIG.VAT, DECIMALS[cur]);
  return { cur, sub, tax, amount: round(sub + tax, DECIMALS[cur]) };
}
function travellerSlots(ctx) {

  if (ctx.travellerMode === 'lead' || ctx.travellerMode === 'driver') return ['adult'];
  return [];
}

function bindDetailsStep(ctx) {

function validateCard(cf) {
  const d = formData(cf), er = {};

  if (num.length !== 16) er.number = t('err_cardNumber');
  if (!V.latinName(d.holder || '')) er.holder = t('err_latin');
  const m = /^(\d{2})\/(\d{2})$/.exec(d.exp || '');
  if (!m || +m[1] < 1 || +m[1] > 12) er.exp = t('err_expiry');
  else { const end = new Date(2000 + +m[2], +m[1], 0, 23, 59); if (end < new Date()) er.exp = t('err_expired'); }
  if (!/^\d{3,4}$/.test(d.cvc || '')) er.cvc = t('err_cvc');
  return showErrors(cf, er) ? { number: num, holder: d.holder, exp: d.exp, last4: num.slice(-4) } : null;
}
/** Simulated 3-D Secure challenge. Resolves true (authenticated) / false (failed or cancelled). */
function threeDS(provider, amountLabel, last4) {
  return new Promise(res => {
    let attempts = 0, settled = false;
    const done = (v) => { if (!settled) { settled = true; res(v); } };
    openModal({ title: `${icon('lock')} 3-D Secure`, size: 'sm', onClose: () => done(false),
      body: `<div id="tds"><div class="loading-block"><span class="spinner"></span>${t('redirectingBank')}</div></div>`,
      onOpen: (wrap, close) => {
        setTimeout(() => {
          const box = $('#tds', wrap); if (!box) return;
          box.innerHTML = `<div class="gateway-frame"><div class="gateway-head"><strong>PG Test Bank</strong><span class="xsmall">Verified by Visa</span></div><div class="card-body">
            <div class="kv"><span>${t('merchant')}</span><span>Pacific Gulf</span></div><div class="kv"><span>${t('amount')}</span><span>${amountLabel}</span></div><div class="kv"><span>${t('card')}</span><span dir="ltr">•••• ${last4}</span></div><div class="kv"><span>${t('gateway')}</span><span>${provider}</span></div>
            <p class="small mt-2">${t('otpSent')}</p>
            <form id="otp-f" novalidate>${field({ name: 'otp', label: t('otpCode'), ltr: true, attrs: 'inputmode="numeric" maxlength="6" autocomplete="one-time-code"', hint: t('otpHint') })}
            <div class="row mt-2"><button type="button" class="btn btn-outline" id="otp-cancel">${t('cancel')}</button><button class="btn btn-primary" type="submit">${t('verify')}</button></div></form></div></div>`;
          const f = $('#otp-f', box); f.otp.focus();
          $('#otp-cancel', box).onclick = () => { done(false); close('cancel'); };
          f.addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = f.querySelector('[type=submit]'); setBusy(btn, true, t('verifying'));
            setTimeout(() => {
              setBusy(btn, false);
              if (f.otp.value.trim() === '123456') { done(true); close('ok'); return; }
              attempts++;
              if (attempts >= 3) { done(false); close('fail'); return; }
              showErrors(f, { otp: t('err_otp', { n: 3 - attempts }) });
            }, 700);
          });
        }, 900);
      } });
  });
}
async function doPay(ctx) {
  const btn = $('#pay-btn'); const out = $('#pay-result'); out.innerHTML = '';
  const pr = coPricing(ctx);
  const u = state.user;
  let card = null;
  if (ctx.pay.method === 'card') { card = validateCard($('#card-form')); if (!card) return; }
  ctx.ref = ctx.ref || genRef();
  setBusy(btn, true, t('processingPayment'));
  const PROVN = { stripe: 'Stripe', paytabs: 'PayTabs', myfatoorah: 'MyFatoorah' };
  try {
    if (card) {
      const authed = await threeDS(PROVN[ctx.pay.provider], moneyIn(pr.amount, pr.cur), card.last4);
      if (!authed) throw { code: '3ds_failed' };
    }
    const payment = await api.payments.charge({ provider: ctx.pay.provider, method: ctx.pay.method, card, amount: pr.amount, currency: pr.cur, ref: ctx.ref, userId: u ? u.userId : null });
    if (state.checkout !== ctx) return;
    btn.innerHTML = `<span class="spinner"></span> ${t('confirmingBooking')}`;
    const booking = await ctx.book({ ref: ctx.ref, customer: { ...ctx.contact, userId: u ? u.userId : null }, travellers: ctx.travellers, amount: pr.amount, currency: pr.cur, tax: pr.tax, payment, notes: ctx.notes || [] });
    if (u && ctx.saveTr) { for (const tr of ctx.travellers) { const exists = (store.travellers[u.userId] || []).some(x => x.passportNo && x.passportNo === tr.passportNo); if (!exists && tr.passportNo) await api.travellers.save(u.userId, { ...tr, id: uid('TR-') }); } }
    await api.notify.send(booking);
    if (ctx.onDone) ctx.onDone();
    state.checkout = null; state.justBooked = booking.ref;
    go('#/confirmation/' + booking.ref);
  } catch (e) {
    setBusy(btn, false);
    if (state.checkout !== ctx) return;
    out.innerHTML = `<div class="card result-state" style="border-color:var(--danger)"><div class="result-icon bad">${icon('x')}</div><h3>${t('paymentFailed')}</h3><p class="muted">${errMsg(e)}</p>

    out.scrollIntoView({ block: 'center', behavior: 'smooth' });
    $('#retry-btn').onclick = () => doPay(ctx);
    $('#change-btn').onclick = () => { out.innerHTML = ''; const n = $('#f-number'); if (n) { n.value = ''; n.focus(); } $('.pay-methods').scrollIntoView({ block: 'center' }); };
    toast(t('paymentFailed'), 'error');
  }
}

      ${w.transactions.map(tx => `<tr><td>${fmtDateTime(tx.at)}</td><td><span class="badge ${tx.type === 'payment' ? 'badge-danger' : tx.type === 'refund' ? 'badge-info' : 'badge-success'}">${t('tx_' + tx.type)}</span></td><td dir="ltr" style="text-align:start">${esc(tx.ref)}</td><td style="text-align:end;font-weight:700;color:${sign(tx) < 0 ? 'var(--danger)' : 'var(--success)'}" dir="ltr">${sign(tx) < 0 ? '−' : '+'}${moneyIn(tx.amount, 'OMR')}</td></tr>`).join('')}
    </tbody></table></div>` : `<div class="empty">${icon('wallet')}<p>${t('noTransactions')}</p></div>`}</div>`;
  $('#topup').onclick = () => {
    let amt = 25;
    openModal({ title: t('topUpWallet'), body: `<div class="filter-title">${t('chooseAmount')} (OMR)</div><div class="row mb-2" role="group">${[10, 25, 50, 100].map(a => `<button type="button" class="chip" data-amt="${a}" aria-pressed="${a === amt}">${moneyIn(a, 'OMR')}</button>`).join('')}</div>
      <form id="tu-form" novalidate><div class="form-grid">${field({ name: 'custom', label: t('customAmount'), type: 'number', attrs: 'min="5" max="2000" step="1"', value: amt })}<div></div>
      ${field({ name: 'number', label: t('cardNumber'), ltr: true, placeholder: '4242 4242 4242 4242', cls: 'full', attrs: 'inputmode="numeric" maxlength="19"' })}
      ${field({ name: 'holder', label: t('cardHolder'), ltr: true, cls: 'full', value: state.user.name.toUpperCase() })}
      ${field({ name: 'exp', label: t('expiry'), ltr: true, placeholder: 'MM/YY', attrs: 'maxlength="5"' })}${field({ name: 'cvc', label: 'CVC', ltr: true, placeholder: '123', attrs: 'maxlength="4" inputmode="numeric"' })}</div></form>
      <p class="xsmall muted mt-1">${t('testCards')}</p>`,
      onOpen: (wrap) => {
        $$('[data-amt]', wrap).forEach(b => b.addEventListener('click', () => { amt = +b.dataset.amt; $('[name=custom]', wrap).value = amt; $$('[data-amt]', wrap).forEach(x => x.setAttribute('aria-pressed', x === b)); }));
        const f = $('#tu-form', wrap);
        f.number.addEventListener('input', (e) => { e.target.value = e.target.value.replace(/\D/g, '').slice(0, 16).replace(/(.{4})/g, '$1 ').trim(); });
        f.exp.addEventListener('input', (e) => { let v = e.target.value.replace(/\D/g, '').slice(0, 4); if (v.length > 2) v = v.slice(0, 2) + '/' + v.slice(2); e.target.value = v; });
      },
      actions: [{ label: t('cancel') }, { label: `${icon('lock')} ${t('topUp')}`, cls: 'btn-primary', onClick: async (close, btn, wrap) => {
        const f = $('#tu-form', wrap); const a = +f.custom.value;
        if (!(a >= 5 && a <= 2000)) { showErrors(f, { custom: t('err_amount') }); return; }
        const card = validateCard(f); if (!card) return;
        setBusy(btn, true);
        const authed = await threeDS('Stripe', moneyIn(a, 'OMR'), card.last4);
        if (!authed) { setBusy(btn, false); toast(t('err_3ds_failed'), 'error'); return; }
        try { await api.wallet.topup(state.user.userId, a, card); close(); toast(t('topUpDone', { a: moneyIn(a, 'OMR') }), 'success'); rerender(); }
        catch (er) { setBusy(btn, false); toast(errMsg(er), 'error'); }
      } }] });
  };
}

async function pageProfile(ctx) {
  if (!requireUser(ctx)) return;
  const u = state.user;
  view(accountShell('profile', `<div class="card card-body mb-2"><h2 class="mt-0" style="font-size:1.15rem">${t('personalInfo')}</h2><form id="pf-form" novalidate><div class="form-grid">
      ${field({ name: 'name', label: t('fullName'), required: true, value: u.name })}
      ${field({ name: 'email', label: t('email'), value: u.email, ltr: true, attrs: 'readonly aria-readonly="true"', hint: t('emailReadonly') })}
      ${field({ name: 'phone', label: t('phone'), required: true, value: u.phone, ltr: true })}
      <div class="field"><span class="label">${t('memberSince')}</span><div class="input" style="background:var(--surface-2)">${fmtDate(u.createdAt)}</div></div>
    </div><button class="btn btn-primary mt-2" type="submit">${t('saveChanges')}</button></form></div>
    <div class="card"><div class="card-body row-between"><div><h2 class="mb-0" style="font-size:1.15rem">${t('savedTravellers')}</h2><p class="small muted mb-0">${t('savedTravellersSub')}</p></div><button class="btn btn-outline btn-sm" id="add-tr">${icon('plus')} ${t('addTraveller')}</button></div><div id="tr-list" style="border-top:1px solid var(--border)">${loader()}</div></div>`));
  bindAccountShell();
  const pf = $('#pf-form');
  pf.addEventListener('submit', async (e) => {
    e.preventDefault(); const d = formData(pf); const er = {};
    if (!V.name(d.name)) er.name = t('err_required'); if (!V.phone(d.phone)) er.phone = t('err_phone');
    if (!showErrors(pf, er)) return;
    const btn = pf.querySelector('[type=submit]'); setBusy(btn, true);
    const nu = await api.auth.updateProfile(u.userId, { name: d.name.trim(), phone: d.phone.trim() }); state.user = nu; savePrefs(); setBusy(btn, false); renderHeader(); toast(t('profileSaved'), 'success');
  });
  const drawTr = async () => {
    const list = await api.travellers.list(u.userId); if (ctx.stale()) return;
    $('#tr-list').innerHTML = list.length ? `<div class="table-wrap" style="border:0;border-radius:0"><table class="table"><thead><tr><th>${t('name')}</th><th>${t('type')}</th><th>${t('passportNo')}</th><th>${t('passportExpiry')}</th><th><span class="sr-only">${t('actions')}</span></th></tr></thead><tbody>
      ${list.map(x => `<tr><td>${esc(t('title_' + (x.title || 'MR')))} ${esc(x.firstName)} ${esc(x.lastName)}</td><td>${t(x.type)}</td><td dir="ltr" style="text-align:start">${esc(x.passportNo || '—')}</td><td>${x.passportExpiry ? fmtDate(x.passportExpiry) : '—'}${x.passportExpiry && x.passportExpiry < addDays(todayISO(), 182) ? ` <span class="badge badge-warning">${t('expiresSoon')}</span>` : ''}</td>
        <td style="white-space:nowrap"><button class="icon-btn" data-edit="${x.id}" aria-label="${t('edit')} ${esc(x.firstName)}">${icon('edit')}</button> <button class="icon-btn" data-del="${x.id}" aria-label="${t('remove')} ${esc(x.firstName)}">${icon('trash')}</button></td></tr>`).join('')}</tbody></table></div>`
      : `<div class="empty">${icon('users')}<p>${t('noSavedTravellers')}</p></div>`;
  };
  const trModal = (tr) => {
    const x = tr || { type: 'adult', title: 'MR', nationality: 'OM' };
    openModal({ title: tr ? t('editTraveller') : t('addTraveller'), body: `<form id="tr-form" novalidate><div class="form-grid">
      ${field({ name: 'type', label: t('type'), type: 'select', options: [['adult', t('adult')], ['child', t('child')], ['infant', t('infant')]], value: x.type })}
      ${field({ name: 'title', label: t('titleLbl'), type: 'select', options: ['MR', 'MRS', 'MS', 'MSTR', 'MISS'].map(v => [v, t('title_' + v)]), value: x.title })}
      ${field({ name: 'firstName', label: t('firstNamePassport'), required: true, ltr: true, value: x.firstName || '' })}${field({ name: 'lastName', label: t('lastNamePassport'), required: true, ltr: true, value: x.lastName || '' })}
      ${field({ name: 'dob', label: t('dob'), type: 'date', required: true, value: x.dob || '', attrs: `max="${todayISO()}"` })}${field({ name: 'nationality', label: t('nationality'), type: 'select', options: NATIONALITIES.map(n => [n[0], state.lang === 'ar' ? n[1] : n[2]]), value: x.nationality })}
      ${field({ name: 'passportNo', label: t('passportNo'), required: true, ltr: true, value: x.passportNo || '' })}${field({ name: 'passportExpiry', label: t('passportExpiry'), type: 'date', required: true, value: x.passportExpiry || '' })}</div></form>`,
      actions: [{ label: t('cancel') }, { label: t('save'), cls: 'btn-primary', onClick: async (close, btn, wrap) => {
        const f = $('#tr-form', wrap); const d = formData(f); const er = {};
        if (!V.latinName(d.firstName)) er.firstName = t('err_latin'); if (!V.latinName(d.lastName)) er.lastName = t('err_latin');
        if (!validISO(d.dob) || d.dob > todayISO()) er.dob = t('err_date'); if (!V.passport(d.passportNo)) er.passportNo = t('err_passport'); if (!validISO(d.passportExpiry)) er.passportExpiry = t('err_date');
        if (!showErrors(f, er)) return;
        setBusy(btn, true);
        await api.travellers.save(u.userId, { ...d, id: tr ? tr.id : uid('TR-'), firstName: d.firstName.toUpperCase(), lastName: d.lastName.toUpperCase(), passportNo: d.passportNo.toUpperCase() });
        close(); toast(t('travellerSaved'), 'success'); drawTr();
      } }] });
  };
  $('#add-tr').onclick = () => trModal(null);
  $('#tr-list').addEventListener('click', async (e) => {
    const ed = e.target.closest('[data-edit]'), del = e.target.closest('[data-del]');
    const list = await api.travellers.list(u.userId);
    if (ed) trModal(list.find(x => x.id === ed.dataset.edit));
    if (del) { const x = list.find(y => y.id === del.dataset.del); if (await confirmModal({ title: t('removeTraveller'), body: `<p>${t('removeTravellerBody', { n: esc(x.firstName + ' ' + x.lastName) })}</p>`, danger: true, confirmLabel: t('remove') })) { await api.travellers.remove(u.userId, x.id); drawTr(); toast(t('travellerRemoved')); } }
  });
  drawTr();
}

/* =====================================================================
   21) AI ASSISTANT (floating) — UI only; logic isolated in api.ai.chat
   ===================================================================== */
function aiReply(text) {
  const s = String(text).toLowerCase();
  const has = (...w) => w.some(x => s.includes(x));
  const link = (href, label) => `<a href="${href}">${label}</a>`;
  if (has('track', 'تتبع', 'حجزي', 'مرجعي', 'reference')) return t('ai_track') + '\n' + link('#/track', t('trackBooking') + ' ' + ARW());
  if (has('visa', 'تأشير', 'فيزا')) return t('ai_visa', { fee: money(35) }) + '\n' + link('#/visa', t('browseVisas') + ' ' + ARW()) + ' · ' + link('#/visa/how', t('howVisasWork'));
  if (has('hajj', 'umrah', 'حج', 'عمر')) return t('ai_hajj', { p: money(420) }) + '\n' + link('#/hajj', t('viewPackages') + ' ' + ARW());
  if (has('cancel', 'refund', 'إلغاء', 'الغاء', 'استرداد', 'استرجاع')) return t('ai_cancel');
  if (has('wallet', 'محفظ')) return t('ai_wallet') + '\n' + link('#/account/wallet', t('wallet') + ' ' + ARW());
  if (has('pay', 'card', 'دفع', 'بطاق')) return t('ai_pay');
  if (has('hotel', 'فندق', 'فنادق')) return t('ai_hotel') + '\n' + link('#/hotels', t('searchHotels') + ' ' + ARW());
  if (has('car', 'سيار', 'تأجير')) return t('ai_car', { p: money(9.5) }) + '\n' + link('#/cars', t('searchCars') + ' ' + ARW());
  if (has('holiday', 'package', 'باق', 'عطل', 'salalah', 'صلالة', 'istanbul', 'إسطنبول')) return t('ai_holiday', { p: money(189) }) + '\n' + link('#/holidays', t('explorePackages') + ' ' + ARW());
  if (has('dubai', 'دبي', 'flight', 'fly', 'طيران', 'رحل', 'تذكر')) {
    const q = { ...defaultAirQ(), to: has('istanbul', 'إسطنبول') ? 'IST' : has('cairo', 'القاهرة') ? 'CAI' : has('london', 'لندن') ? 'LHR' : 'DXB' };
    return t('ai_flight', { city: L(AP[q.to].city) }) + '\n' + link('#/search/air?' + qs(q), t('searchFlights') + ' ' + ARW());
  }
  if (has('hello', 'hi', 'مرحب', 'السلام', 'هلا', 'أهلا')) return t('ai_hello');
  if (has('contact', 'phone', 'تواصل', 'اتصال', 'رقم')) return t('ai_contact', { p: CONFIG.SUPPORT_PHONE, e: CONFIG.SUPPORT_EMAIL });
  return t('ai_default') + '\n' + link('#/contact', t('nav_contact') + ' ' + ARW());
}
function renderAI() {
  const root = $('#ai-root');
  if (!state.chat.length) state.chat.push({ role: 'bot', text: t('ai_greeting') });
  root.innerHTML = `<button type="button" class="ai-fab no-print" id="ai-fab" aria-expanded="${state.chatOpen}" aria-controls="ai-panel" aria-label="${t('aiAssistant')}">${icon(state.chatOpen ? 'x' : 'sparkle')}</button>
  ${state.chatOpen ? `<section class="ai-panel no-print" id="ai-panel" role="dialog" aria-label="${t('aiAssistant')}">
    <div class="ai-head"><div><strong>${icon('sparkle')} ${t('aiAssistant')}</strong><div class="xsmall" style="opacity:.8">${t('aiSub')}</div></div><button class="icon-btn" id="ai-close" aria-label="${t('close')}">${icon('x')}</button></div>
    <div class="ai-msgs" id="ai-msgs" aria-live="polite">${state.chat.map(m => `<div class="msg ${m.role}">${m.role === 'user' ? esc(m.text) : m.text}</div>`).join('')}</div>
    <div class="ai-suggest">${['ai_s1', 'ai_s2', 'ai_s3', 'ai_s4'].map(k => `<button type="button" class="chip" data-sug="${esc(t(k))}">${t(k)}</button>`).join('')}</div>
    <form class="ai-form" id="ai-form"><label class="sr-only" for="ai-in">${t('typeMessage')}</label><input id="ai-in" class="input" autocomplete="off" placeholder="${t('typeMessage')}"><button class="btn btn-primary" type="submit" aria-label="${t('send')}">${icon('send', 'flip-rtl')}</button></form>
    <div class="xsmall muted center" style="padding:0 10px 8px">${t('aiDisclaimer')}</div>
  </section>` : ''}`;
  $('#ai-fab').onclick = () => { state.chatOpen = !state.chatOpen; renderAI(); if (state.chatOpen) $('#ai-in').focus(); else $('#ai-fab').focus(); };
  if (!state.chatOpen) return;
  const msgs = $('#ai-msgs'); msgs.scrollTop = msgs.scrollHeight;
  $('#ai-close').onclick = () => { state.chatOpen = false; renderAI(); $('#ai-fab').focus(); };
  $('#ai-panel').addEventListener('keydown', (e) => { if (e.key === 'Escape') { state.chatOpen = false; renderAI(); $('#ai-fab').focus(); } });
  const send = async (text) => {
    text = String(text || '').trim(); if (!text) return;
    state.chat.push({ role: 'user', text });
    renderAI(); const m = $('#ai-msgs'); m.insertAdjacentHTML('beforeend', `<div class="msg bot typing" id="ai-typing" aria-label="${t('typing')}"><span></span><span></span><span></span></div>`); m.scrollTop = m.scrollHeight;
    try { const r = await api.ai.chat(state.chat); state.chat.push({ role: 'bot', text: r.reply }); }
    catch (e) { state.chat.push({ role: 'bot', text: t('err_generic') }); }
    if (state.chatOpen) { renderAI(); $('#ai-in').focus(); }
  };
  $('#ai-form').addEventListener('submit', (e) => { e.preventDefault(); send($('#ai-in').value); });
  $$('[data-sug]').forEach(b => b.addEventListener('click', () => send(b.dataset.sug)));
}

function init() {
  loadStore();
  const prefs = loadPrefs();
  if (prefs.userId) { const u = store.users.find(x => x.userId === prefs.userId); if (u) { const { password: _p, ...pub } = u; state.user = pub; } }
  applyLangAttrs(); applyTheme(); renderChrome();
  window.addEventListener('hashchange', onHashChange);
  if (window.matchMedia) { const mq = window.matchMedia('(prefers-color-scheme: dark)'); const h = () => { if (!state.theme) renderHeader(); }; if (mq.addEventListener) mq.addEventListener('change', h); }
  $('#skip-link').addEventListener('click', () => { $('#app').focus(); });
  lastPathForScroll = parseHash().path;
  router();
}
